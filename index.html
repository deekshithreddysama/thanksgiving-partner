<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanksgiving Partner</title>
<style>
:root{--bg:#f3efe6;--card:#fff;--fg:#1d2a24;--muted:#5b6b62;--accent:#b3261e;--accent-fg:#fff;--pine:#165b33;--line:#d9d3c3}
@media (prefers-color-scheme:dark){:root{--bg:#0f1f17;--card:#18291f;--fg:#eef3ee;--muted:#9db0a4;--accent:#e0554b;--accent-fg:#16100f;--pine:#7ad39a;--line:#2b4033;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:24px 16px;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:400px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
h1{font-size:1.75rem;margin:0 0 8px}
p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,button{font:inherit;width:100%;box-sizing:border-box;border-radius:8px;padding:12px 14px}
input{border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{margin-top:12px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#result{margin-top:20px}
.pick{font-size:2.4rem;font-weight:700;color:var(--pine);line-height:1.1;margin:4px 0 8px}
.err{color:var(--accent)}
</style></head><body>
<main><div class="card">
<h1>Thanksgiving Partner</h1>
<p>Enter your name to get your partner. You give a gift to your partner, and your partner gives a gift to you.</p>
<form id="f"><label for="n">Your name</label>
<input id="n" autocomplete="off" placeholder="For example, Sama">
<button id="go" type="submit">Reveal my partner</button></form>
<div id="result" aria-live="polite"></div>
</div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlQpJt1zxfBjf7k2QDR0ZRMdv5WfXZktw",
  authDomain: "thanksgiving-partner.firebaseapp.com",
  databaseURL: "https://thanksgiving-partner-default-rtdb.firebaseio.com",
  projectId: "thanksgiving-partner",
  storageBucket: "thanksgiving-partner.firebasestorage.app",
  messagingSenderId: "350945734337",
  appId: "1:350945734337:web:e916bbbe3742afe5226e40"
};

const PLAYERS = ["Sanny", "Rishi", "Vamshi", "Ramya", "Siri", "Sama"];
const PARTNER = { Vamshi: "Ramya", Ramya: "Vamshi", Sanny: "Rishi", Rishi: "Sanny", Siri: "Sama", Sama: "Siri" };

// True if the people in `left` can all be paired with no real partners together.
function canPair(left) {
  if (left.length === 0) return true;
  const [a, ...rest] = left;
  return rest.some(b => PARTNER[a] !== b && canPair(rest.filter(x => x !== b)));
}

const db = getDatabase(initializeApp(firebaseConfig));
const res = document.getElementById("result");
const btn = document.getElementById("go");

function err(msg) { res.innerHTML = '<p class="err"></p>'; res.firstChild.textContent = msg; }

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const q = document.getElementById("n").value.trim().toLowerCase();
  const me = PLAYERS.find(p => p.toLowerCase() === q);
  if (!me) return err("Name not found. Check the spelling.");
  btn.disabled = true;
  try {
    const out = await runTransaction(ref(db, "pairs"), cur => {
      cur = cur || {};
      if (cur[me]) return cur;
      const free = PLAYERS.filter(p => !cur[p] && p !== me);
      const options = free.filter(b => b !== PARTNER[me] && canPair(free.filter(x => x !== b)));
      if (options.length === 0) return; // abort: no valid pair
      const pick = options[Math.floor(Math.random() * options.length)];
      cur[me] = pick;
      cur[pick] = me;
      return cur;
    });
    const pairs = out.snapshot.val() || {};
    if (!pairs[me]) return err("No valid partner is left. Ask the organizer to reset the draw.");
    res.innerHTML = 'Hi <span id="me"></span>.<br>Your Thanksgiving partner is:<div class="pick"></div><p>This is saved. It will not change.</p>';
    res.querySelector("#me").textContent = me;
    res.querySelector(".pick").textContent = pairs[me];
  } catch (x) {
    err("The draw could not be saved. Check your connection and try again.");
  } finally {
    btn.disabled = false;
  }
});
</script></body></html>
